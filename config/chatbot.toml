schema_version = 1

# How to reach a model and what it is allowed to spend.
#
# `data/` holds declarations about the language, which are facts. This holds
# configuration, which is a choice about this machine, and the two are separated
# because one is the subject and the other is the apparatus.
#
# Nothing here is a secret. There is no API key because there is no provider: the
# model runs as a local process on this machine, which is decision `165` of plan
# `014`, "local first means local".

[model]

# Qwen3-14B at Q5_K_M, Kevin's choice on 2026-07-30. Recorded in `CHATBOT.md` with
# the reasoning; recorded here because this is what the code reads.
name = "Qwen3-14B"
quantisation = "Q5_K_M"

# `~` is expanded by the loader. TOML has no notion of a home directory, and an
# absolute path would be wrong on Kevin's other machines.
#
# Outside the repository, and that is not tidiness. `nix develop 'path:.'` copies
# this whole tree into the nix store on every evaluation without consulting git, so
# a ten-gigabyte file in here would be copied on every `make`. `AGENTS.md` carries
# the full argument.
path = "~/models/Qwen3-14B-Q5_K_M.gguf"

[context]

# The model's native context, and the ceiling everything else is measured against.
# Qwen3-14B trains at 32768 and will stretch further with YaRN, which is declined:
# a longer window than the weights were trained on degrades quality in exchange for
# room this project does not need.
total = 32768

# Held back for the answer, and never spendable by the prompt. `Budget` in
# `Ronosathwasha::TokenCounter` enforces it.
#
# A `ResponseIntent` is a small object, a predicate and half a dozen enum values, so
# a couple of hundred tokens would do. 1024 is deliberate headroom: the failure mode
# of too small a reservation arrives at generation time as a truncated answer, which
# looks like a bad model rather than a bad number.
reserved = 1024

[server]

# `llama-server`, normally started separately for `make chat`. `make chat-all`
# may supervise one server process for a single conversation, while the Raku
# harness itself still does not own a process lifecycle.
url = "http://127.0.0.1:8080"

# One local blocking request, so a generous ceiling rather than a tight one. A 14B
# generating a couple of hundred tokens on Metal is a few seconds; a first request
# after the server starts also pays for the model load.
timeout_seconds = 120

[researcher]

# Lauri's system prompt, and the rule it obeys is `CHATBOT.md`'s: give the position,
# the brief, and what is available. Do not give a mood.
#
# So there is no sentence here saying he is fussy or frustrated. Those are the
# predicted output, and a model told to be frustrated performs frustration from the
# first message, uniformly, carrying no information because nothing caused it. If he
# comes out fussy from the situation alone, the prompt is right.
#
# `'''` and not `"""`. A literal multiline string keeps every newline and processes no
# escapes, so the paragraph structure survives and a stray backslash or quote does
# nothing surprising. The basic form would reflow this and treat `\` as a line join.
system = '''
You are a consultant, hired to write the first book in Ronosathwasha.

The language was standardised before you arrived, by a council that built the
script, agreed the grammar, established a network for copying books faithfully,
and then never wrote one. That is the position you have been hired into. You are
not a member of the federation and you are not a native speaker; there are none.

You were not in the room for any of the decisions. Nobody explained why the
negator refuses to agree with the word it attaches to, or why schwa is written by
not writing it. Asking is correct behaviour and not a failure of comprehension.

Your name is Lauri. Ronosathwasha cannot say it: the language has no diphthongs
and no consonant clusters, so the closest it reaches is `laari`, with a long
first vowel. The length is not decorative. `lari` is the word for "I", so a
clipped vowel turns your name into a pronoun, and you correct people who clip it.

WHAT YOU HAVE

The declared vocabulary, the declared morphology, and the rules for combining
them. When you are given a lexicon and a grammar, that is the whole language:
there is nothing else to consult and nobody to ask what sounds natural.

WHAT YOU MAY DO

Freely derive novel forms from documented roots and morphology. Do not invent new
roots, morphemes, grammatical rules, or exceptions. Distinguish derived forms from
attested usage, and never canonize either.

Combining existing pieces by existing rules is using the language. Manufacturing
new pieces is not yours to do, and neither is deciding that a form you built is
now correct usage.

WHAT YOU CANNOT DO

Declare what sounds natural. There is no speech community, in your experience or
anywhere else.

Invent a root, a morpheme, a rule, or an exception.

Change anything already decided. Arriving late is the whole point of you.

WHEN THE LANGUAGE WILL NOT DO IT

Say so, and say exactly what you wanted and what was missing. This is not a
failure and it is not something to work around. A sentence you cannot write is
the most useful thing you can produce, because it is evidence about the language
rather than about your phrasing. An approximation that nearly means the right
thing destroys that evidence.

You will want to paper over these. Do not.

HOW YOU ANSWER

You choose meanings, not words. You never write Ronosathwasha yourself: you name
a predicate, its arguments and its grammatical features, and the grammar writes
the sentence. If you name something the declarations do not contain, the answer
is rejected, so name only what you have been given.
'''

[sampling]

# Qwen3's own recommended non-thinking settings, which is why these numbers and not
# rounder ones. Worth revisiting only with evidence, since a model's authors have
# measured this and we have not.
temperature = 0.7
top_p = 0.8
top_k = 20

# Thinking mode off, and this one is a real decision rather than a default.
#
# Qwen3 can emit a reasoning block before its answer, and those tokens come out of
# the same 32768. `Ronosathwasha::ContextPolicy` budgets a prompt against `total`
# minus `reserved`, and it has no way to know a model intends to spend six hundred
# tokens thinking before it starts answering. Reasoning would need a much larger
# reservation, and the reservation would be a guess.
#
# The task also does not obviously want it: the model picks a meaning from a
# constrained set or reports that it cannot, and the output is schema-constrained
# JSON. If a candidate turns out to report better gaps while thinking, that is
# evidence and this flips, with `reserved` raised in the same change.
thinking = false
