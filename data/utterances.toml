# ---------------------------------------------------------------- rejected ---
#
# The first entry to carry this status, and the reason the status exists.

[[utterance]]
text = "Lari miriswemedi."
english = "I am being a teaching, ongoing, right now"
status = "rejected"
derived_from = "Mirireri layi mirimedi."
derivation = "copularizer inserted before the tense, subject made first person and the object dropped"
rejected_because = """
Grammatical and pointless. The copularizer makes `miri` an identity, so this \
predicates being a teaching rather than doing any teaching, then anchors that \
identity to the present and holds it open. English reaches the same place with "I \
am being teaching", which is also well-formed and also not something anybody says. \
`Lari mirimedi.` is what is meant.

Kept because decision 22 permits it and decision 24 orders it correctly, so nothing \
in the declarations rules it out. A rule that admits this and a speaker who declines \
it is the gap worth recording, and it is the difference between a grammar and a \
language.
"""
speech_act = "declarative"
predicate = "miri"
nominal_predicate = true
tense = "present"
aspect = "continuous"
polarity = "affirmative"
modality = "asserted"
arguments = ["subject"]

[[utterance]]
text = "Lari mirireme."
english = "I teacher, in the sense of doing teacher-ish things"
status = "rejected"
derived_from = "Mirireri mirime."
derivation = "present -me on the nominal mirire with no copularizer, verbing the noun directly"
rejected_because = """
Valid and nobody would say it, for a different reason than `Lari miriswemedi.` \
Category-neutral roots permit tense on any root, so this verbs the noun and means \
doing teacher-ish things rather than being a teacher, which is a real and useful \
capability.

It fails on this noun in particular. `mirire` is `miri` plus `re`, teach plus \
person, so verbing it lands next to `mirime` from the verb it was built out of. Two \
routes to one meaning and the shorter one wins.

So the construction is fine and the word is the wrong candidate for it. Verbing \
`ta` or `shwi`, which no verb was ever extracted from, is where it earns its place.
"""
speech_act = "declarative"
predicate = "mirire"
tense = "present"
aspect = "simple"
polarity = "affirmative"
modality = "asserted"
arguments = ["subject"]

