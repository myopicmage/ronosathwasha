schema_version = 1

# The executable corpus: sentences with their meaning stated as fields rather
# than as an English gloss, so the realizer can be checked against them.
#
# `data/examples.toml` is the same sentences for a reader. This file is the
# same sentences for a program, and only the settled subset of them.
#
# ## status
#
# Four values, and the distinction Kevin asked for on 2026-07-28:
#
#   attested   Kevin wrote this sentence. It is evidence about the language.
#   derived    Composed mechanically from shipped declarations, not yet read
#              by Kevin. Usable by the grammar; not evidence about anything.
#   reviewed   Derived, and Kevin has accepted it as good Ronosathwasha.
#   rejected   Derived, grammatical, and wrong. Kept with its reason, because a
#              sentence the rules permit and a speaker would not is the most
#              informative thing this project can produce.
#
# Derivation may only recombine morphemes that `data/morphology.toml` already
# declares and stems the lexicon already lists. Coining a word, a rule, or a
# form that does not follow from those is not derivation and does not belong
# here.
#
# ## excluded on purpose
#
# Nothing is here that the language has not settled. Every construction below
# uses only current morphemes; the retired ones live in `data/morphology.toml`
# as history and never as corpus.

