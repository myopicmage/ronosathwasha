# ----------------------------------------------------------------- derived ---
#
# Five sentences, filling the three strata nothing attested reaches: past
# tense, future tense, and proximal reference. Two more exercise the back
# alternants, which every attested sentence leaves untouched because every
# attested predicate happens to be front or neutral.
#
# Each recombines a shipped morpheme with a shipped stem and nothing else.
# `rorothwa` is the stem of `rorothwaswo`, "to love", with the back infinitive
# removed; `LANGUAGE.md` decision 16 already writes `dororothwamo` from it.

[[utterance]]
text = "Lari thinəse."
english = "I ate"
status = "derived"
derived_from = "Lari thinəme."
derivation = "past -se in place of present -me, front stem"
speech_act = "declarative"
predicate = "thinə"
tense = "past"
aspect = "simple"
polarity = "affirmative"
modality = "asserted"
arguments = ["subject"]

[[utterance]]
text = "Lari thinəthe."
english = "I will eat"
status = "derived"
derived_from = "Lari thinəme."
derivation = "future -the in place of present -me, front stem"
speech_act = "declarative"
predicate = "thinə"
tense = "future"
aspect = "simple"
polarity = "affirmative"
modality = "asserted"
arguments = ["subject"]

[[utterance]]
text = "She thinəme."
english = "(I) eat this food"
status = "derived"
derived_from = "Sho thinəme."
derivation = "proximal she in place of distal sho"
speech_act = "declarative"
predicate = "thinə"
tense = "present"
aspect = "simple"
polarity = "affirmative"
modality = "asserted"
arguments = []
reference = "proximal"

[[utterance]]
text = "Lari rorothwamo."
english = "I love"
status = "derived"
derived_from = "Lari thinəme."
derivation = "back stem rorothwa, which selects the back present -mo"
speech_act = "declarative"
predicate = "rorothwa"
tense = "present"
aspect = "simple"
polarity = "affirmative"
modality = "asserted"
arguments = ["subject"]

[[utterance]]
text = "Lari rorothwaso."
