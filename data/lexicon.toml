# The lexicon.
#
# To add a word, type one line in the right section:
#
#     "runə" = "dog"
#
# That is the whole format. Keys are quoted because ə, ð and θ are not valid
# bare TOML keys, so quoting everything keeps one pattern instead of two.
#
# Nothing else is recorded here, because everything else is derivable:
# the syllables, the code points, the harmony class and whether the word is
# writable at all are all computed from data/script.toml. `pytest` will tell
# you if a word cannot be written in the script.
#
# Put parenthetical detail inside the gloss:  "rorothwaswo" = "love (very-like)"
#
# Seeded from the ~2021 notes in the Scrivener project. 61 entries.

# Vocabulary backlog. These are semantic slots, not canonical forms. Prefer
# deriving related meanings from shared machinery instead of coining fifty
# unrelated roots.
#
# Conversation repair
#   mean, signify
#   tell
#   answer
#
# Thought and understanding
#   forget
#
# Interrogatives
#   who
#   what
#   where
#   when
#   why
#
# Manner and comparison
#   how
#   which
#   same
#   different
#   other, another
#
# Clause connection
#   and
#   or
#   but
#   because
#   if
#
# Relations
#   with
#   without
#   from
#   for, intended for
#   about, concerning
#
# Basic action
#   exist, be present
#   do, make
#   come
#   give
#   take, receive
#
# Ability and coordination
#   can, be able
#   need, must
#   help
#   wait, remain
#   stop, finish
#
# Perception and discovery
#   see
#   hear
#   feel
#   find
#   show
#
# Social and physical anchors
#   friend, ally
#   enemy, opponent
#   place
#   water
#
[pronoun]
"la" = "I"
"lo" = "we"
"na" = "you"
"no" = "you (plural)"
"ða" = "he/she/it (alive)"
"ðo" = "they (alive)"
"ya" = "it (not alive)"
"yo" = "they (not alive)"


[demonstrative]
"she" = "this"
"sha" = "that"
"sho" = "that over there"


[noun]
"nəla" = "ball"
"sene" = "cat"
"runə" = "dog"
"tono" = "drink"
"shimi" = "family"
"nishimi" = "parent (up-family)"
"sishimi" = "child (down-family)"
"thə" = "fire"
"thinə" = "food"
"ta" = "home"
"thwasha" = "language, tongue"
"thwashamwu" = "language-expression (usually word)"
"tuma" = "magic"
"ro" = "person"
"rono" = "people"
"shwi" = "rabbit"
"moluyo" = "crab"
"mirire" = "teacher (teach-person)"
"mwu" = "thing"
"dələ" = "name"


# The w-infix turns a body-relative direction into a compass one.
[direction]
"niðə" = "up"
"siðə" = "down"
"miðə" = "left"
"ðiðə" = "right"
"nwiðə" = "north"
"swiðə" = "south"
"mwiðə" = "west"
"ðwiðə" = "east"


[verb]
"tonoswo" = "to drink"
"thinəswe" = "to eat (food-verb)"
"tiswe" = "to have"
"thwaswo" = "to like"
"rorothwaswo" = "to love (very-like)"
"miriswe" = "to teach"
"medi" = "go (now-continuous)"
"mediswe" = "to go (now-continuous)"
"neswe" = "to use"
"twaswo" = "to want"
"tonə" = "know"
"tonədu" = "remember, retain (continue-knowing)"
"taya" = "think"
"meliya" = "understand"
"mwatheya" = "believe"
"thwashaswo" = "to speak, say"
"teswe" = "to ask (question-verb)"


[time]
"dwe" = "day"
"me" = "now, present"
"seme" = "recently (past-present)"
"roroso" = "far past"
"rorotwathaso" = "ancient past"
"sheme" = "today (this-now)"
"shedwe" = "today (this-day)"
"the" = "future"
"methe" = "soon"
"rorotho" = "far future"


[adjective]
"nara" = "good"
"tura" = "bad"
"twatha" = "old"
"rorotwatha" = "ancient (very-old)"


[adverb]
"roro" = "very"


# Affixes. Position is in the gloss: (verb) marks where the stem goes.
[marker]
"swe" = "infinitive (front or neutral), (verb)swe"
"swo" = "infinitive (back), (verb)swo"
"ne" = "plural (front or neutral), (noun)ne"
"no" = "plural (back), (noun)no"
"sa" = "possessive, (noun)sa"
"me" = "present tense (front or neutral), (verb)me; negation before back, me(verb)"
"mo" = "present tense (back), (verb)mo; negation before front or neutral, mo(verb)"
"se" = "past tense (front or neutral), (verb)se"
"so" = "past tense (back), (verb)so"
"the" = "future tense (front or neutral), (verb)the"
"tho" = "future tense (back), (verb)tho"
"te" = "question (front or neutral), te(verb)"
"to" = "question (back), to(verb)"
"de" = "command (front or neutral), de(verb)"
"do" = "command (back), do(verb)"
"di" = "continuous (front or neutral), (verb)di"
"du" = "continuous (back), (verb)du"
"li" = "might (front or neutral), li(verb)"
"lu" = "might (back), lu(verb)"
# Negation is anti-harmonic, so it takes the opposite class to the word it
# attaches to: `mo` before a front or neutral word, `me` before a back one.
# Both live on the tense entries above, because a TOML table cannot repeat a
# key and the present tense already claims those two forms. Position separates
# them: the negator is a prefix and the tense marker is a suffix.


