# Affixes. Position is in the gloss: (verb) marks where the stem goes.
[marker]
"swo" = "infinitive, (verb)swo"
"ne" = "plural, (noun)ne"
"sa" = "possessive, (noun)sa"
"me" = "present tense, (verb)me"
"the" = "future tense, (verb)the"
"yo" = "command, yo(verb)"
"li" = "might, li(verb)"
"ma" = "negation, ma (verb)"
"tho" = "question, tho(verb)"


[particle]
"shi" = "at"
"thi" = "in"
"mi" = "near"
"yi" = "object"


[phrase]
"narame" = "hello (good now)"
"narathe" = "goodbye (good future)"
"so" = "yes"
"ma" = "no"
"thino twa" = "I'm hungry (I want food)"
"thina twa" = "I'm thirsty (I want drink)"
"thwame" = "I like"
"thənəlayi tumame" = "I cast fireball"


# Attested but currently unwritable. Not a backlog of missing words: these are
# real entries blocked by two decisions, and each needs respelling rather than
# inventing. The tests report these separately instead of failing on them.
#
#   ch and j were dropped from the inventory (2026-07-26)
#   h was never in it, and w stopped being a consonant
[respell]
"jechiswo" = "to go"
"jechi" = "go (imperative)"
"je" = "past tense, (verb)je"
"ji" = "continuous, (verb)ji"
"ju" = "subject particle"
"jeme" = "recently"
"roroje" = "far past"
"rorotwathaje" = "ancient past"
"chi" = "this"
"cha" = "that"
"chu" = "that over there"
"chime" = "today"
"chidwe" = "today (this-day)"
"hiðə" = "right"
"hwiðə" = "east"
"hi" = "towards"
"yəwə" = "crab"
