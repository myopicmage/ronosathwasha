# Affixes. Position is in the gloss: (verb) marks where the stem goes.
[marker]
"swe" = "infinitive or copularizer (front or neutral), (verb)swe or (nominal)swe"
"swo" = "infinitive or copularizer (back), (verb)swo or (nominal)swo"
"ne" = "plural (front or neutral), (noun)ne"
"no" = "plural (back), (noun)no"
"sa" = "possessive, (noun)sa"
"me" = "present tense (front or neutral), (verb)me; negation or negative indefinite before back, me(verb) or me(nominal)"
"mo" = "present tense (back), (verb)mo; negation or negative indefinite before front or neutral, mo(verb) or mo(nominal)"
"se" = "past tense (front or neutral), (verb)se"
"so" = "past tense (back), (verb)so"
"the" = "future tense (front or neutral), (verb)the"
"tho" = "future tense (back), (verb)tho"
"te" = "question (front or neutral), te(verb)"
"to" = "question (back), to(verb)"
"twe" = "selective question (front or neutral), twe(nominal)"
"two" = "selective question (back), two(nominal)"
"de" = "command (front or neutral), de(verb)"
"do" = "command (back), do(verb)"
"di" = "continuous (front or neutral), (verb)di"
"du" = "continuous (back), (verb)du"
"li" = "might or indefinite (front or neutral), li(verb) or li(nominal)"
"lu" = "might or indefinite (back), lu(verb) or lu(nominal)"


[derivational_marker]
"re" = "agentive (front or neutral), (verb)re"
"ro" = "agentive (back), (verb)ro"


# Negation and the negative indefinite are anti-harmonic, so they take the
# opposite class to the word they attach to: `mo` before a front or neutral
# word, `me` before a back one.
# Both live on the tense entries above, because a TOML table cannot repeat a
# key and the present tense already claims those two forms. Position separates
# the prefixes from the tense marker; host separates their two prefix jobs.


