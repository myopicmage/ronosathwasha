schema_version = 2

# Current sentence examples, kept in step with the rest of the data files.
#
# This file used to preserve the December 2023 Scrivener forms and was frozen
# on purpose. That is no longer its job: Scrivener holds the archaeology, and
# every TOML file here states the language as it is now. The provenance below
# records where these sentences came from, not what state they are in.
#
# `docs/basic-sentences.html` renders these same fourteen sentences, in this
# order, and `tests/test_examples.py` fails if the two disagree. They drifted
# once already, the page tracking six months of decisions while this file
# stayed at the original transcription.

[source]
project = "dnd - friends.scriv"
binder_path = "Places / Ancient World / Language / Grammar / Examples"
document_id = "FE98C8C7-0D9B-4752-92D9-343A2D118357"
status = "current"
note = """
Originally transcribed from the December 2023 Scrivener source and since
brought forward through the decisions in LANGUAGE.md. The attested 2023 forms
remain in the Scrivener project.
"""

[[example]]
english = "I eat"
ronesathwasha = "Lari thinəme."
analysis = [
  "I (subject marker)",
  "food (present tense)",
]
common = ["thinəme"]
common_note = "drop subject"

[[example]]
english = "I am eating"
ronesathwasha = "Lari thinəmedi."
analysis = [
  "I (subject marker)",
  "food (present tense) (continuous)",
]
common = ["thinəmedi"]

[[example]]
english = "I do not eat"
ronesathwasha = "Lari mothinəme."
analysis = [
  "I (subject marker)",
  "(negation marker) food (present tense)",
]
common = ["mothinəme"]
common_note = "drop grammar markers"

[[example]]
english = "The teacher teaches"
ronesathwasha = "Mirireri mirime."
analysis = [
  "Teach-person (subject marker)",
  "teach (present tense)",
]

[[example]]
english = "The teacher is teaching me"
ronesathwasha = "Mirireri layi mirimedi."
analysis = [
  "Teach-person (subject marker)",
  "me (object marker)",
  "teach (present tense) (continuous marker)",
]

[[example]]
english = "(You) teach me (now)"
ronesathwasha = "Layi demirime."
analysis = [
  "I (object marker)",
  "(command marker) teach (present tense)",
]

[[example]]
english = "(I) eat that food (over there)"
ronesathwasha = "Sho thinəme."
analysis = [
  "That (over there)",
  "food (present tense)",
]

[[example]]
english = "I might eat that food"
ronesathwasha = "Lari sha lithinəme."
analysis = [
  "I (subject marker)",
  "that (near you)",
  "(might) food (present tense)",
]
common = [
  "lithinəme",
  "sha lithinəme",
]

[[example]]
english = "My dog eats"
ronesathwasha = "Lasa runəru thinəme."
analysis = [
  "I (possessive)",
  "dog (subject marker)",
  "food (present tense)",
]

[[example]]
english = "Do you eat?"
ronesathwasha = "Nari tethinəme?"
analysis = [
  "You (subject marker)",
  "(question marker) food (present tense)",
]

[[example]]
english = "(I) want to eat"
ronesathwasha = "Thinəswe twame."
analysis = [
  "Food (infinitive)",
  "want (present tense)",
]
common = ["thinə twa"]
common_note = "drop markers, becomes “I want food”"

[[example]]
english = "(I) want that (thing)"
ronesathwasha = "Shamwuyu twame."
analysis = [
  "That-thing",
  "want (present tense)",
]
common = ["shamwu twa"]
common_note = "object and tense markers dropped, implied"

[[example]]
english = "I go home"
ronesathwasha = "Lari taði medime."
analysis = [
  "I (subject marker)",
  "home (towards)",
  "go (present)",
]
common = ["ta medi"]
common_note = "drop subject, location marker, and tense marker"

[[example]]
english = "(Person) has a dog"
ronesathwasha = "Ðari runəyu time."
analysis = [
  "Alive-thing (subject marker)",
  "dog (object marker)",
  "have (present tense)",
]
