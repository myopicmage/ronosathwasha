# ------------------------------------------------------------- superseded ---
#
# Retired, and kept because retirement is not deletion. Two of these are
# still perfectly typeable, which is the whole hazard: nothing in the font or
# the keyboard will object to `yomirime`, so a reader meets a command that has
# not existed since decision 16 and has no way to tell.
#
# `writable` records whether the form can still be produced at all. `je`, `ji`
# and `ju` cannot, because decision 1 dropped the affricates and took the
# letter with them. Those are safe by accident. The rest are not.
#
# `alternation = "none"` is not the same as `"neutral"`. Neutral means the
# morpheme legitimately has one form because it has no backness to agree
# about, which is `sa` and was `ma`. None means one form where two were
# needed, which is what made `yo`, `tho`, `ju`, `je` and `ji` replaceable in
# the first place. Reading them as the same thing loses the reason.

[[morpheme]]
id = "negation-ma"
gloss = "NEG"
role = "polarity"
attaches_to = ["verb"]
position = "prefix"
alternation = "neutral"
form = "ma"
status = "superseded"
superseded_by = "negation"
decision = 3
writable = true

[[morpheme]]
id = "command-yo"
gloss = "IMP"
role = "speech-act"
attaches_to = ["verb"]
position = "prefix"
alternation = "none"
form = "yo"
status = "superseded"
superseded_by = "command"
decision = 16
writable = true

# The form is current; this morpheme is not. `tho` is the back future today,
# and asking the lexicon "what is `tho`" is the question that cannot be
# answered without knowing the position it appeared in.
[[morpheme]]
id = "question-tho"
gloss = "Q"
role = "speech-act"
attaches_to = ["verb"]
position = "prefix"
alternation = "none"
form = "tho"
status = "superseded"
superseded_by = "question"
decision = 15
writable = true

[[morpheme]]
id = "subject-ju"
gloss = "SBJ"
role = "case"
attaches_to = ["nominal"]
position = "suffix"
alternation = "none"
form = "ju"
status = "superseded"
superseded_by = "subject"
decision = 7
writable = false

[[morpheme]]
id = "past-je"
gloss = "PST"
role = "tense"
attaches_to = ["verb"]
position = "suffix"
alternation = "none"
form = "je"
status = "superseded"
