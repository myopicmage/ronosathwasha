# Every productive morpheme in the language.
#
# This file is the authority on what a morpheme *does*: its role, where it
# attaches, how it alternates, and whether it is still current. `lexicon.toml`
# remains the authority on words. Where the two overlap, a morpheme's surface
# form appears in both, and nothing else does.
#
# **Keyed by identity, not by form.** A morpheme is named by the job it does,
# and its spellings are fields. That is not a stylistic choice: `me` and `mo`
# are the present tense and they are also the negator, and `tho` is the back
# future today and was the question marker yesterday. Keying on the form makes
# those collisions unrepresentable in a TOML table, which is why the lexicon
# had to carry two of them in a comment. Keying on the job makes them ordinary.
#
# `front_stem` and `back_stem` name the form taken *with* a stem of that class,
# never the form's own vowel class. For a harmonic morpheme the two coincide
# and the distinction looks pedantic. For the anti-harmonic negator they are
# deliberately crossed, and the same two field names still say the right thing.
#
# Neutral stems select the front alternant, so `front_stem` covers front and
# neutral both. `alternation` names which rule produced the arrangement, so
# nothing has to be inferred from comparing the two forms.
#
# `gloss` is the label this morpheme takes in an interlinear gloss, following
# the Leipzig Glossing Rules. It lives here rather than in the renderer because
# a table of labels in code is a second place to drift and can name a morpheme
# this file does not declare. Required, so a new morpheme cannot arrive without
# one and be silently unglossable.
#
# Leipzig's standard list covers most of these. `CONT` and the four `LOC.*` are
# language-specific labels, which rule 5 expressly permits; `CONT` rather than
# `PROG` because the language calls the aspect continuous. A superseded morpheme
# keeps the label of the job it did, so it shares one with its replacement.

# ---------------------------------------------------------------- current ---

[[morpheme]]
id = "infinitive"
gloss = "INF"
role = "nonfinite"
attaches_to = ["verb"]
position = "suffix"
alternation = "harmonic"
front_stem = "swe"
back_stem = "swo"
status = "current"

# The infinitive forms also became productive copularizers. Attached to a
# nominal, they make an identity or classification predicate without locating
# it in time. Tense may follow when time is contrastive: `Laari-swe-me` means
# that the name is Laari now, not merely that it is Laari. Decision 22.
[[morpheme]]
id = "copularizer"
gloss = "COP"
role = "predication"
attaches_to = ["nominal"]
position = "suffix"
alternation = "harmonic"
front_stem = "swe"
back_stem = "swo"
status = "current"

