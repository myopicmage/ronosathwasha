# The one licensed harmony violation. The forms are the present tense's, and
# the classes are crossed against it: a front word takes `mo`, a back word
# takes `me`, so the negator always leans the wrong way and is visible at a
# glance without being stressed. Decision 3.
[[morpheme]]
id = "negation"
gloss = "NEG"
role = "polarity"
attaches_to = ["verb"]
position = "prefix"
alternation = "anti-harmonic"
front_stem = "mo"
back_stem = "me"
status = "current"

# Two hosts, and the second one built the interrogative series. On a verb this
# questions the predicate, giving the polar question `Nari tethinəme?`. On a
# nominal it questions the referent, and every interrogative word the lexicon
# lists is that: `to` prefixed to a noun already declared there.
#
#   toro     to + ro      person   who
#   tomwu    to + mwu     thing    what
#   toluumo  to + luumo   place    where
#   toduruu  to + duruu   time     when
#   toðoru   to + ðoru    reason   why
#
# All five bases are back words, so all five take `to`, and the rule reproduces
# every listed form with nothing left over. The lexicon entries are therefore
# derived rather than primitive, and `tothwasha` is available for free.
#
# The two uses are in complementary distribution, which is why `Nari toro?`
# needs no further marking: the interrogative word already carries the morpheme,
# and marking the clause again would write `to` twice. Mandarin arranges 吗 and
# its question words the same way; Japanese keeps か in both and does not.
[[morpheme]]
id = "question"
gloss = "Q"
role = "speech-act"
attaches_to = ["verb", "nominal"]
position = "prefix"
alternation = "harmonic"
front_stem = "te"
back_stem = "to"
status = "current"

