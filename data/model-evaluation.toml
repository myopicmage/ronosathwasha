schema_version = 1

# The evaluator is allowed to say "not decided" only after this file has made
# the decision visible. These are gates, not a score chosen after seeing a
# candidate model's output.
minimum_cases = 50
minimum_overall_accuracy = 0.90
minimum_stratum_accuracy = 0.80
required_axes = [
    "speech_act",
    "tense",
    "aspect",
    "polarity",
    "modality",
    "argument_structure",
    "question_kind",
]

# `arguments` carries role and stem together because that is the semantic unit
# the model returns. The evaluator turns `subject:la` into the wire object's
# `{ role = "subject", stem = "la" }` at the boundary.

