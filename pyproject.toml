# Not a package definition, just tool configuration. The dev shell provides the
# interpreter and the dependencies; nothing here is installed.

[tool.mypy]
python_version = "3.14"
strict = true
files = ["ronesathwasha", "tools", "tests"]
pretty = true

[[tool.mypy.overrides]]
# fontTools ships partial stubs at best, and its dynamic table access defeats
# them. Our own code stays strict; only the boundary is untyped.
module = ["fontTools.*", "ufoLib2.*", "ufo2ft.*", "defcon.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
